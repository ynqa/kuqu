[package]
name = "kuqu"
version = "0.1.0"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
edition = "2024"
description = "SQL for Kubernetes resources"
repository = "https://github.com/ynqa/kuqu"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.98"
async-trait = "0.1.88"
clap = { version = "4.5.40", features = ["derive"] }
datafusion = "48.0.1"
datafusion-datasource = "48.0.1"
datafusion-datasource-json = "48.0.1"
kubex = { path = "../kubex" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.46.1", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
